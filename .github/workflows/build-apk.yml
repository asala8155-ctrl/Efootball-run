name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android Build Tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y aapt zipalign apksigner dalvik-exchange librsvg2-bin libandroid-23-java

      - name: Build APK via Pipeline
        run: |
          chmod +x scripts/build-apk.sh
          ./scripts/build-apk.sh

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ExitLag-eFootball-Booster-APK
          path: public/ExitLag-eFootball-Booster.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ExitLag eFootball Booster v1.0.0 (Android APK)
          draft: false
          prerelease: false
          files: public/ExitLag-eFootball-Booster.apk
          body: |
            ## 🎮 ExitLag Mobile - eFootball Pro Booster (Android APK)
            
            دانلود مستقیم فایل رسمی APK اندروید:
            - فایل نصبی آماده نصب روی تمام گوشی‌های اندروید (سامسونگ، شیائومی، هواوی و...)
            - کاهش پینگ و پایدارسازی پکت‌های بازی eFootball
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
