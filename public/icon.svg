<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6"/>

  <!-- Cyber grid lines in background -->
  <path d="M 0 128 L 512 128 M 0 256 L 512 256 M 0 384 L 512 384 M 128 0 L 128 512 M 256 0 L 256 512 M 384 0 L 384 512" stroke="#10b981" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Outer Neon Shield Ring -->
  <circle cx="256" cy="240" r="170" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" stroke-dasharray="16 12" filter="url(#glow)"/>

  <!-- Inner Cyber Tech Ring -->
  <circle cx="256" cy="240" r="145" fill="#0b1322" stroke="#334155" stroke-width="4"/>

  <!-- Lightning Bolt & Gamepad Symbol -->
  <g filter="url(#glow)" transform="translate(146, 120) scale(0.85)">
    <!-- Gamepad Body -->
    <path d="M 40 100 C 40 40, 90 20, 130 20 L 130 20 C 170 20, 220 40, 220 100 C 220 160, 200 220, 170 220 C 150 220, 140 200, 130 180 C 120 200, 110 220, 90 220 C 60 220, 40 160, 40 100 Z" fill="url(#bgGrad)" stroke="url(#emeraldGrad)" stroke-width="6"/>
    
    <!-- D-Pad Plus -->
    <path d="M 85 80 L 85 120 M 65 100 L 105 100" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Action Buttons -->
    <circle cx="165" cy="85" r="7" fill="#10b981"/>
    <circle cx="180" cy="100" r="7" fill="#34d399"/>
    <circle cx="150" cy="100" r="7" fill="#059669"/>
    <circle cx="165" cy="115" r="7" fill="#6ee7b7"/>

    <!-- Central High Voltage Thunderbolt -->
    <polygon points="135,50 115,110 135,110 120,165 155,100 135,100" fill="url(#emeraldGrad)" filter="url(#glow)"/>
  </g>

  <!-- eFootball Division Badge Text -->
  <rect x="140" y="380" width="232" height="48" rx="24" fill="#10b981" fill-opacity="0.15" stroke="url(#emeraldGrad)" stroke-width="2"/>
  <text x="256" y="412" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#34d399" text-anchor="middle" letter-spacing="4">EXITLAG eF</text>
</svg>
